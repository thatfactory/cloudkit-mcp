name: Publish to npm

on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: npm-publish-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  publish:
    if: ${{ !github.event.release.draft && !github.event.release.prerelease }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: npm-publish
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name }}
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24.20.0
          registry-url: https://registry.npmjs.org
          cache: npm
      - run: npm ci
      - name: Verify immutable release identity
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          node --import tsx scripts/release-preflight.ts --tag "$RELEASE_TAG" --event-sha "$GITHUB_SHA" --main-ref origin/main
      - run: npm run check
      - name: Verify supported npm trusted-publishing client
        run: |
          node -e "const { execFileSync } = require('node:child_process'); const [major, minor] = execFileSync('npm', ['--version'], { encoding: 'utf8' }).trim().split('.').map(Number); if (major < 11 || (major === 11 && minor < 5)) process.exit(1)"
      - name: Create one authoritative release artifact
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          npm run clean
          npm run build
          node --import tsx scripts/release-artifact.ts create --destination "$RUNNER_TEMP/cloudkit-release" --tag "$RELEASE_TAG" --source-sha "$GITHUB_SHA"
      - name: Inspect and smoke the exact artifact
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          TARBALL="$RUNNER_TEMP/cloudkit-release/$(node -p "require('$RUNNER_TEMP/cloudkit-release/release-artifact.json').filename")"
          node scripts/verify-package.mjs --tarball "$TARBALL"
          node scripts/pack-smoke.mjs --tarball "$TARBALL"
          node --import tsx scripts/release-artifact.ts verify --destination "$RUNNER_TEMP/cloudkit-release" --tag "$RELEASE_TAG" --source-sha "$GITHUB_SHA"
      - name: Publish the inspected artifact
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          TARBALL="$RUNNER_TEMP/cloudkit-release/$(node -p "require('$RUNNER_TEMP/cloudkit-release/release-artifact.json').filename")"
          node --import tsx scripts/release-artifact.ts verify --destination "$RUNNER_TEMP/cloudkit-release" --tag "$RELEASE_TAG" --source-sha "$GITHUB_SHA"
          npm publish "$TARBALL" --access public --provenance --ignore-scripts
