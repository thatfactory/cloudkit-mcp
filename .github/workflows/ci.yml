name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check

  governance:
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - run: AgentGuidelines/Scripts/validate_consumer_setup.swift
      - run: AgentGuidelines/.agents/skills/agent-guidelines-audit/scripts/check_markdown_wrapping.swift AGENTS.md README.md Documentation
      - run: git diff --check
